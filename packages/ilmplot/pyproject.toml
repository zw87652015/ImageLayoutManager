[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ilmplot"
version = "0.1.0"
description = "Qt-free core for ILM's editable *.ilmplot.svg plot documents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.23",
]

[tool.setuptools.packages.find]
where = ["src"]
