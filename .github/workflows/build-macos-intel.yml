name: Build macOS Intel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      MACOS_ARCH: x86_64
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Intel Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          architecture: x64
      - name: Confirm architecture
        run: |
          uname -m
          python -c "import platform, sys; print(sys.version); print(platform.machine()); assert platform.machine() == 'x86_64'"
      - name: Check direct dependency wheels
        run: |
          python -m pip download \
            --only-binary=:all: \
            --no-deps \
            --dest "$RUNNER_TEMP/ilm-wheels" \
            -r requirements.txt \
            "PyInstaller==6.21.0"
      - name: Install dependencies
        run: |
          python -m pip install \
            -r requirements.txt \
            "PyInstaller==6.21.0"
          python -m pip check
      - name: Record build environment
        run: |
          mkdir -p ci-output
          python --version > ci-output/python-version.txt
          python -m pip freeze > ci-output/installed-versions.txt
          git rev-parse HEAD > ci-output/source-commit.txt
          sw_vers > ci-output/macos-version.txt
      - name: Build Intel application
        run: python build_onefile_macos.py
      - name: Apply and verify ad-hoc signature
        run: |
          test -d dist/ImageLayoutManager.app
          codesign --force --deep --sign - \
            dist/ImageLayoutManager.app
          codesign --verify --deep --strict --verbose=2 \
            dist/ImageLayoutManager.app
          lipo -archs dist/ImageLayoutManager.app/Contents/MacOS/ImageLayoutManager | tee ci-output/app-architecture.txt
          test "$(lipo -archs dist/ImageLayoutManager.app/Contents/MacOS/ImageLayoutManager)" = "x86_64"
      - name: Create application ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/ImageLayoutManager.app \
            ci-output/ImageLayoutManager_macOS_Intel.zip
          cd ci-output
          shasum -a 256 ImageLayoutManager_macOS_Intel.zip \
            > SHA256SUMS.txt
      - name: Upload build files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ILM-macOS-Intel-${{ github.run_number }}
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
